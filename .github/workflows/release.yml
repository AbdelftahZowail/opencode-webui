name: Release

# Tag push (v*) → build dist once as a gate, then compile one self-contained
# binary per target (scripts/build-binary.sh), attach the tarballs + checksums
# to a GitHub release. Binaries EMBED dist/ — no separate dist artifact needed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-dist:
    # Gate: typecheck + frontend build must pass before spending matrix time.
    # Each matrix leg rebuilds dist/ itself (workspaces are not shared).
    name: build dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck
      - run: bun run build

  binaries:
    name: binary ${{ matrix.target }}
    needs: build-dist
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: linux-x64 }
          - { os: ubuntu-latest,  target: linux-arm64 }
          - { os: macos-latest,   target: darwin-x64 }
          - { os: macos-latest,   target: darwin-arm64 }
          - { os: windows-latest, target: windows-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      # Builds dist/ (missing on a fresh runner), regenerates the embedded
      # asset manifest, compiles this one target, packages release/*.tar.gz.
      - run: bash scripts/build-binary.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: release/*.tar.gz
          if-no-files-found: error

  release:
    name: github release
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: release
      - name: sha256sums
        run: cd release && sha256sum ./*.tar.gz > SHA256SUMS.txt
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            release/*.tar.gz release/SHA256SUMS.txt \
            --title "opencode-webui $GITHUB_REF_NAME" \
            --generate-notes
